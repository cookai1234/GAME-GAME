<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morpion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #312e81 0%, #6b21a8 50%, #831843 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  
  .container {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(12px);
    border-radius: 1.5rem;
    padding: 2rem;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.2);
    max-width: 28rem;
    width: 100%;
  }
  
  h1 { font-size: 3rem; color: white; text-align: center; margin-bottom: 0.5rem; }
  h2 { font-size: 2.25rem; color: white; text-align: center; margin-bottom: 0.5rem; }
  .subtitle { text-align: center; color: #ddd6fe; margin-bottom: 2rem; }
  
  .btn {
    width: 100%;
    padding: 1rem 1.5rem;
    border: none;
    border-radius: 0.75rem;
    color: white;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    transition: transform 0.2s, filter 0.2s;
    box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
  }
  
  .btn:hover { transform: scale(1.05); filter: brightness(1.1); }
  
  .btn-blue { background: linear-gradient(to right, #3b82f6, #06b6d4); }
  .btn-purple { background: linear-gradient(to right, #a855f7, #ec4899); }
  .btn-green { background: linear-gradient(to right, #22c55e, #10b981); }
  .btn-yellow { background: linear-gradient(to right, #eab308, #f97316); }
  .btn-red { background: linear-gradient(to right, #ef4444, #e11d48); }
  
  .btn-back {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 0.75rem;
  }
  .btn-back:hover { background: rgba(255, 255, 255, 0.2); }
  
  .hidden { display: none !important; }
  
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  
  .icon-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    padding: 0.5rem;
    border-radius: 0.5rem;
    cursor: pointer;
    font-size: 1.25rem;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.2); }
  
  .mode-info { text-align: center; color: white; }
  .mode-info .mode { font-weight: bold; font-size: 1.125rem; }
  .mode-info .diff { font-size: 0.75rem; font-weight: 600; }
  
  .diff-easy { color: #86efac; }
  .diff-medium { color: #fde047; }
  .diff-hard { color: #fca5a5; }
  
  .scores {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  
  .score-box {
    border-radius: 0.75rem;
    padding: 0.75rem;
    text-align: center;
    border: 1px solid;
  }
  .score-x { background: rgba(59, 130, 246, 0.2); border-color: rgba(96, 165, 250, 0.3); }
  .score-x .label { color: #93c5fd; }
  .score-draw { background: rgba(107, 114, 128, 0.2); border-color: rgba(156, 163, 175, 0.3); }
  .score-draw .label { color: #d1d5db; }
  .score-o { background: rgba(236, 72, 153, 0.2); border-color: rgba(244, 114, 182, 0.3); }
  .score-o .label { color: #f9a8d4; }
  
  .score-box .label { font-size: 0.75rem; font-weight: 600; }
  .score-box .value { color: white; font-size: 1.5rem; font-weight: bold; }
  
  .status {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 0.75rem;
    padding: 0.75rem;
    margin-bottom: 1rem;
    text-align: center;
    color: white;
    font-weight: 600;
    font-size: 1.125rem;
  }
  
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  
  .cell {
    aspect-ratio: 1;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 0.75rem;
    font-size: 3rem;
    font-weight: bold;
    color: white;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }
  .cell:hover:not(:disabled) { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }
  .cell:disabled { cursor: not-allowed; }
  .cell.x { color: #93c5fd; }
  .cell.o { color: #f9a8d4; }
  .cell.winning {
    background: rgba(250, 204, 21, 0.3);
    border-color: #facc15;
    animation: pulse 1s infinite;
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
</style>
</head>
<body>

<!-- MENU PRINCIPAL -->
<div class="container" id="menu-screen">
  <h1>Morpion</h1>
  <p class="subtitle">Choisissez votre mode de jeu</p>
  <button class="btn btn-blue" onclick="startPvP()">👥 Joueur vs Joueur</button>
  <button class="btn btn-purple" onclick="showScreen('difficulty-screen')">🤖 Joueur vs IA</button>
</div>

<!-- DIFFICULTÉ -->
<div class="container hidden" id="difficulty-screen">
  <h2>Difficulté</h2>
  <p class="subtitle">Choisissez le niveau de l'IA</p>
  <button class="btn btn-green" onclick="startAI('easy')">⚡ Facile</button>
  <button class="btn btn-yellow" onclick="startAI('medium')">🧠 Moyen</button>
  <button class="btn btn-red" onclick="startAI('hard')">💀 Difficile</button>
  <button class="btn btn-back" onclick="showScreen('menu-screen')">🏠 Retour</button>
</div>

<!-- JEU -->
<div class="container hidden" id="game-screen">
  <div class="header">
    <button class="icon-btn" onclick="backToMenu()">🏠</button>
    <div class="mode-info">
      <div class="mode" id="mode-label">PvP</div>
      <div class="diff" id="diff-label"></div>
    </div>
    <button class="icon-btn" onclick="resetGame()">🔄</button>
  </div>
  
  <div class="scores">
    <div class="score-box score-x">
      <div class="label" id="label-x">X</div>
      <div class="value" id="score-x">0</div>
    </div>
    <div class="score-box score-draw">
      <div class="label">NULS</div>
      <div class="value" id="score-draw">0</div>
    </div>
    <div class="score-box score-o">
      <div class="label" id="label-o">O</div>
      <div class="value" id="score-o">0</div>
    </div>
  </div>
  
  <div class="status" id="status">Tour du joueur X</div>
  
  <div class="board" id="board"></div>
  
  <button class="btn btn-purple hidden" id="replay-btn" onclick="resetGame()">🔄 Rejouer</button>
</div>

<script>
let mode = null;
let difficulty = null;
let board = Array(9).fill(null);
let isXNext = true;
let scores = { X: 0, O: 0, draw: 0 };
let winningLine = null;
let gameOver = false;

const WINNING_LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function showScreen(id) {
  document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function startPvP() {
  mode = 'pvp';
  difficulty = null;
  resetAll();
  showScreen('game-screen');
  updateUI();
}

function startAI(diff) {
  mode = 'ai';
  difficulty = diff;
  resetAll();
  showScreen('game-screen');
  updateUI();
}

function backToMenu() {
  mode = null;
  difficulty = null;
  scores = { X: 0, O: 0, draw: 0 };
  resetAll();
  showScreen('menu-screen');
}

function resetAll() {
  board = Array(9).fill(null);
  isXNext = true;
  winningLine = null;
  gameOver = false;
}

function resetGame() {
  resetAll();
  updateUI();
}

function calculateWinner(squares) {
  for (const line of WINNING_LINES) {
    const [a,b,c] = line;
    if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {
      return { winner: squares[a], line };
    }
  }
  return null;
}

function minimax(squares, isMaximizing) {
  const res = calculateWinner(squares);
  if (res?.winner === 'O') return 10;
  if (res?.winner === 'X') return -10;
  if (squares.every(s => s !== null)) return 0;
  
  if (isMaximizing) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (!squares[i]) {
        squares[i] = 'O';
        best = Math.max(best, minimax(squares, false));
        squares[i] = null;
      }
    }
    return best;
  } else {
    let best = Infinity;
    for (let i = 0; i < 9; i++) {
      if (!squares[i]) {
        squares[i] = 'X';
        best = Math.min(best, minimax(squares, true));
        squares[i] = null;
      }
    }
    return best;
  }
}

function getBestMove(squares) {
  let bestScore = -Infinity;
  let move = -1;
  for (let i = 0; i < 9; i++) {
    if (!squares[i]) {
      squares[i] = 'O';
      const score = minimax(squares, false);
      squares[i] = null;
      if (score > bestScore) {
        bestScore = score;
        move = i;
      }
    }
  }
  return move;
}

function getRandomMove(squares) {
  const empty = squares.map((v,i) => v === null ? i : null).filter(v => v !== null);
  return empty[Math.floor(Math.random() * empty.length)];
}

function getMediumMove(squares) {
  return Math.random() < 0.5 ? getBestMove([...squares]) : getRandomMove(squares);
}

function handleClick(i) {
  if (board[i] || gameOver) return;
  if (mode === 'ai' && !isXNext) return;
  
  board[i] = isXNext ? 'X' : 'O';
  isXNext = !isXNext;
  checkGameEnd();
  updateUI();
  
  if (mode === 'ai' && !isXNext && !gameOver) {
    setTimeout(aiMove, 500);
  }
}

function aiMove() {
  let move;
  const copy = [...board];
  if (difficulty === 'easy') move = getRandomMove(copy);
  else if (difficulty === 'medium') move = getMediumMove(copy);
  else move = getBestMove(copy);
  
  if (move !== undefined && move !== -1) {
    board[move] = 'O';
    isXNext = true;
    checkGameEnd();
    updateUI();
  }
}

function checkGameEnd() {
  const res = calculateWinner(board);
  if (res) {
    winningLine = res.line;
    scores[res.winner]++;
    gameOver = true;
  } else if (board.every(s => s !== null)) {
    scores.draw++;
    gameOver = true;
  }
}

function getStatus() {
  const res = calculateWinner(board);
  if (res) {
    if (mode === 'ai') {
      return res.winner === 'X' ? '🎉 Vous avez gagné !' : '🤖 L\'IA gagne !';
    }
    return `🏆 Joueur ${res.winner} gagne !`;
  }
  if (board.every(s => s !== null)) return '🤝 Match nul !';
  if (mode === 'ai') return isXNext ? 'À vous de jouer' : 'L\'IA réfléchit...';
  return `Tour du joueur ${isXNext ? 'X' : 'O'}`;
}

function updateUI() {
  // Mode info
  document.getElementById('mode-label').textContent = mode === 'pvp' ? 'PvP' : 'vs IA';
  const diffEl = document.getElementById('diff-label');
  if (mode === 'ai') {
    const labels = { easy: 'Facile', medium: 'Moyen', hard: 'Difficile' };
    diffEl.textContent = labels[difficulty];
    diffEl.className = 'diff diff-' + difficulty;
  } else {
    diffEl.textContent = '';
  }
  
  // Labels
  document.getElementById('label-x').textContent = mode === 'ai' ? 'VOUS (X)' : 'X';
  document.getElementById('label-o').textContent = mode === 'ai' ? 'IA (O)' : 'O';
  
  // Scores
  document.getElementById('score-x').textContent = scores.X;
  document.getElementById('score-o').textContent = scores.O;
  document.getElementById('score-draw').textContent = scores.draw;
  
  // Status
  document.getElementById('status').textContent = getStatus();
  
  // Board
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  board.forEach((value, i) => {
    const cell = document.createElement('button');
    cell.className = 'cell';
    if (value === 'X') cell.classList.add('x');
    if (value === 'O') cell.classList.add('o');
    if (winningLine?.includes(i)) cell.classList.add('winning');
    cell.textContent = value || '';
    cell.disabled = gameOver || (mode === 'ai' && !isXNext);
    cell.onclick = () => handleClick(i);
    boardEl.appendChild(cell);
  });
  
  // Replay button
  document.getElementById('replay-btn').classList.toggle('hidden', !gameOver);
}
</script>

</body>
</html>
