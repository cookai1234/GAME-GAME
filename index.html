<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎮 Cookai Games</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    text-align: center;
}

/* Titre */
h1 {
    margin-top: 40px;
    color: #4ade80;
    text-shadow: 0 0 15px #4ade80;
}

/* Grille */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 25px;
    max-width: 800px;
    margin: 40px auto;
}

/* Carte jeu */
.card {
    border: 2px solid #4ade80;
    border-radius: 15px;
    padding: 20px;
    transition: 0.3s;
    text-decoration: none;
    color: white;
}

.card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #4ade80;
}

/* Aperçu */
.preview {
    width: 100px;
    height: 100px;
    margin: auto;
    border: 2px solid #4ade80;
    border-radius: 10px;
    margin-bottom: 10px;
}

/* Nom */
.name {
    font-weight: bold;
    margin-top: 10px;
}

/* Badge */
.badge {
    font-size: 12px;
    opacity: 0.7;
}
</style>
</head>

<body>

<h1>🗺️ Choisir un jeu</h1>

<div class="grid">

    <!-- Jeu 1 -->
    <a href="snake.html" class="card">
        <div class="preview"></div>
        <div class="name">🐍 Snake</div>
        <div class="badge">Disponible</div>
    </a>

    <!-- Jeu 2 -->
    <a href="#" class="card">
        <div class="preview"></div>
        <div class="name">🎯 Jeu 2</div>
        <div class="badge">Bientôt</div>
    </a>

    <!-- Jeu 3 -->
    <a href="#" class="card">
        <div class="preview"></div>
        <div class="name">🚀 Jeu 3</div>
        <div class="badge">Bientôt</div>
    </a>

</div>

</body>
</html>
