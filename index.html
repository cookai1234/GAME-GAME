<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Cookai Games</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Orbitron', sans-serif;
    background: #050714;
    color: white;
    text-align: center;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
}

/* Grille cyberpunk en arrière-plan */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(74, 222, 128, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 222, 128, 0.08) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: -2;
    animation: gridMove 20s linear infinite;
}

@keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 50px 50px; }
}

/* Halos lumineux d'arrière-plan */
body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(circle at 20% 30%, rgba(74, 222, 128, 0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.15), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(34, 211, 238, 0.1), transparent 50%);
    z-index: -1;
    pointer-events: none;
    animation: pulse 8s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
}

/* Particules flottantes */
.particles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
}

.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 10px #4ade80, 0 0 20px #4ade80;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    from {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    to {
        transform: translateY(-10vh) translateX(50px);
        opacity: 0;
    }
}

/* Header */
.header {
    padding: 60px 20px 30px;
    position: relative;
}

.logo {
    font-family: 'Press Start 2P', cursive;
    font-size: clamp(1.5rem, 5vw, 2.8rem);
    color: #4ade80;
    text-shadow: 
        0 0 10px #4ade80,
        0 0 20px #4ade80,
        0 0 40px #4ade80,
        0 0 80px rgba(74, 222, 128, 0.5);
    letter-spacing: 4px;
    margin-bottom: 15px;
    animation: flicker 3s infinite alternate;
}

@keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% {
        text-shadow: 
            0 0 10px #4ade80,
            0 0 20px #4ade80,
            0 0 40px #4ade80,
            0 0 80px rgba(74, 222, 128, 0.5);
    }
    20%, 24%, 55% {
        text-shadow: none;
    }
}

.subtitle {
    font-size: clamp(0.9rem, 2vw, 1.2rem);
    color: #22d3ee;
    text-shadow: 0 0 10px #22d3ee;
    letter-spacing: 6px;
    margin-bottom: 20px;
    opacity: 0.9;
}

.divider {
    width: 200px;
    height: 2px;
    margin: 20px auto;
    background: linear-gradient(90deg, transparent, #4ade80, transparent);
    box-shadow: 0 0 10px #4ade80;
}

h1 {
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    color: #fff;
    text-shadow: 0 0 15px #fff, 0 0 30px #4ade80;
    letter-spacing: 3px;
    margin-top: 20px;
    font-weight: 700;
}

/* Grille des jeux */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    max-width: 1000px;
    margin: 50px auto;
    gap: 30px;
    padding: 0 20px;
}

/* Carte de jeu */
.card {
    position: relative;
    border-radius: 20px;
    padding: 30px 20px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none;
    color: white;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
    cursor: pointer;
}

/* Effet de bord lumineux animé */
.card::before {
    content: "";
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    border-radius: 20px;
    padding: 2px;
    background: linear-gradient(135deg, currentColor, transparent, currentColor);
    -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0.8;
    transition: opacity 0.4s;
}

/* Effet de scan lumineux */
.card::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.6s;
}

.card:hover::after {
    left: 100%;
}

/* Couleurs */
.green { color: #4ade80; }
.blue { color: #22d3ee; }
.red { color: #f87171; }
.purple { color: #a855f7; }
.yellow { color: #fbbf24; }
.orange { color: #fb923c; }
.pink { color: #ec4899; }

.green:hover { 
    box-shadow: 0 0 30px #4ade80, 0 0 60px rgba(74, 222, 128, 0.4), inset 0 0 20px rgba(74, 222, 128, 0.1);
}
.blue:hover { 
    box-shadow: 0 0 30px #22d3ee, 0 0 60px rgba(34, 211, 238, 0.4), inset 0 0 20px rgba(34, 211, 238, 0.1);
}
.red:hover { 
    box-shadow: 0 0 30px #f87171, 0 0 60px rgba(248, 113, 113, 0.4), inset 0 0 20px rgba(248, 113, 113, 0.1);
}
.purple:hover { 
    box-shadow: 0 0 30px #a855f7, 0 0 60px rgba(168, 85, 247, 0.4), inset 0 0 20px rgba(168, 85, 247, 0.1);
}
.yellow:hover { 
    box-shadow: 0 0 30px #fbbf24, 0 0 60px rgba(251, 191, 36, 0.4), inset 0 0 20px rgba(251, 191, 36, 0.1);
}
.orange:hover { 
    box-shadow: 0 0 30px #fb923c, 0 0 60px rgba(251, 146, 60, 0.4), inset 0 0 20px rgba(251, 146, 60, 0.1);
}
.pink:hover { 
    box-shadow: 0 0 30px #ec4899, 0 0 60px rgba(236, 72, 153, 0.4), inset 0 0 20px rgba(236, 72, 153, 0.1);
}

.card:hover {
    transform: translateY(-8px) scale(1.03);
}

/* Aperçu */
.preview {
    width: 110px;
    height: 110px;
    margin: 0 auto 20px;
    border: 2px solid currentColor;
    border-radius: 12px;
    position: relative;
    background: rgba(0, 0, 0, 0.4);
    box-shadow: 
        0 0 15px currentColor,
        inset 0 0 15px rgba(255, 255, 255, 0.05);
    transition: all 0.4s;
    overflow: hidden;
}

.card:hover .preview {
    box-shadow: 
        0 0 25px currentColor,
        0 0 50px currentColor,
        inset 0 0 25px rgba(255, 255, 255, 0.1);
    transform: rotate(-2deg);
}

/* 🐍 Snake */
.snake-preview::before {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    top: 30px;
    left: 25px;
    background: #4ade80;
    border-radius: 2px;
    box-shadow:
        16px 0 #4ade80,
        32px 0 #4ade80,
        32px 16px #4ade80,
        32px 32px #4ade80,
        0 0 8px #4ade80,
        16px 0 8px #4ade80;
    animation: snakeMove 2s ease-in-out infinite;
}

.snake-preview::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: #f87171;
    border-radius: 50%;
    top: 70px;
    right: 20px;
    box-shadow: 0 0 10px #f87171, 0 0 20px #f87171;
    animation: pulseFood 1s ease-in-out infinite;
}

@keyframes snakeMove {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(5px); }
}

@keyframes pulseFood {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.7; }
}

/* 👾 Invader */
.invader-preview::before {
    content: "👾";
    position: absolute;
    font-size: 60px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 0 10px #22d3ee);
    animation: invaderFloat 2s ease-in-out infinite;
}

@keyframes invaderFloat {
    0%, 100% { transform: translate(-50%, -50%); }
    50% { transform: translate(-50%, -60%); }
}

/* ♟️ Échecs */
.echec-preview::before {
    content: "♛";
    position: absolute;
    font-size: 70px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #f87171;
    text-shadow: 0 0 15px #f87171, 0 0 30px #f87171;
    animation: chessGlow 2s ease-in-out infinite;
}

@keyframes chessGlow {
    0%, 100% { 
        text-shadow: 0 0 15px #f87171, 0 0 30px #f87171;
    }
    50% { 
        text-shadow: 0 0 25px #f87171, 0 0 50px #f87171, 0 0 70px #f87171;
    }
}

/* ⭕ Morpion */
.morpion-preview::before {
    content: "⭕";
    position: absolute;
    font-size: 45px;
    top: 15px;
    left: 15px;
    filter: drop-shadow(0 0 10px #a855f7);
    animation: rotateO 4s linear infinite;
}

.morpion-preview::after {
    content: "✖";
    position: absolute;
    font-size: 45px;
    bottom: 10px;
    right: 15px;
    color: #a855f7;
    text-shadow: 0 0 15px #a855f7;
    animation: pulseX 2s ease-in-out infinite;
}

@keyframes rotateO {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes pulseX {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.1); }
}

/* 🏓 Pong Neon */
.pong-neon-preview::before {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    background: #fbbf24;
    border-radius: 50%;
    top: 40%;
    left: 20%;
    animation: pongBounce 2s ease-in-out infinite;
    box-shadow: 0 0 10px #fbbf24, 0 0 20px #fbbf24;
}

.pong-neon-preview::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 30px;
    background: #fbbf24;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    box-shadow: 0 0 10px #fbbf24, 0 0 20px #fbbf24;
    animation: paddleMove 2s ease-in-out infinite;
}

@keyframes pongBounce {
    0%, 100% {
        transform: translate(0, 0);
    }
    50% {
        transform: translate(50px, -30px);
    }
}

@keyframes paddleMove {
    0%, 100% { transform: translateY(-50%); }
    50% { transform: translateY(20px); }
}

/* ⚫ Puissance 4 */
.puissance-4-preview::before {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    background: #f87171;
    border-radius: 50%;
    top: 10%;
    left: 30%;
    animation: dropChip 2s ease-in-out infinite;
    box-shadow: 0 0 10px #f87171, 0 0 20px #f87171;
}

.puissance-4-preview::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    background: #fbbf24;
    border-radius: 50%;
    top: 10%;
    right: 30%;
    animation: dropChip 2s ease-in-out infinite;
    box-shadow: 0 0 10px #fbbf24, 0 0 20px #fbbf24;
    animation-delay: 0.5s;
}

@keyframes dropChip {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(40px);
    }
}

/* 🧱 Casse-Brique */
.cassebrique-preview::before {
    content: "";
    position: absolute;
    width: 12px;
    height: 6px;
    background: #ec4899;
    border-radius: 2px;
    top: 15px;
    left: 20px;
    box-shadow: 
        18px 0 #ec4899,
        36px 0 #ec4899,
        54px 0 #ec4899,
        0 0 10px #ec4899;
    animation: brickRow 2s ease-in-out infinite;
}

.cassebrique-preview::after {
    content: "";
    position: absolute;
    width: 30px;
    height: 6px;
    background: #ec4899;
    border-radius: 3px;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 15px #ec4899, 0 0 25px #ec4899;
    animation: paddleHit 2s ease-in-out infinite;
}

@keyframes brickRow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

@keyframes paddleHit {
    0%, 100% { transform: translateX(-50%); }
    50% { transform: translateX(10px); }
}

/* Nom du jeu */
.name {
    font-weight: 700;
    font-size: 1.1rem;
    margin-top: 15px;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 10px currentColor;
    transition: all 0.3s;
}

.card:hover .name {
    text-shadow: 0 0 15px currentColor, 0 0 25px currentColor;
    letter-spacing: 3px;
}

/* Étoiles */
.stars {
    margin-top: 10px;
    color: #fbbf24;
    font-size: 1.1rem;
    text-shadow: 0 0 10px #fbbf24;
    letter-spacing: 3px;
}

/* Badge "PLAY" */
.play-badge {
    display: inline-block;
    margin-top: 15px;
    padding: 6px 18px;
    border: 1px solid currentColor;
    border-radius: 20px;
    font-size: 0.75rem;
    letter-spacing: 3px;
    font-weight: 700;
    transition: all 0.3s;
    text-shadow: 0 0 5px currentColor;
}

.card:hover .play-badge {
    background: currentColor;
    box-shadow: 0 0 15px currentColor;
}

.card:hover .play-badge span {
    color: #050714;
    text-shadow: none;
}

.play-badge span {
    color: #fff;
    text-shadow: 0 0 5px currentColor;
}

/* Footer */
.footer {
    padding: 30px 20px;
    color: #64748b;
    font-size: 0.85rem;
    letter-spacing: 2px;
}

.footer span {
    color: #4ade80;
    text-shadow: 0 0 8px #4ade80;
}

/* Responsive */
@media (max-width: 600px) {
    .grid {
        gap: 20px;
        margin: 30px auto;
    }
    .card {
        padding: 25px 15px;
    }
    .preview {
        width: 90px;
        height: 90px;
    }
}
</style>
</head>

<body>

<!-- Particules flottantes -->
<div class="particles" id="particles"></div>

<!-- En-tête -->
<div class="header">
    <div class="logo">COOKAI</div>
    <div class="subtitle">◆ GAMES ◆</div>
    <div class="divider"></div>
    <h1>🗺️ CHOISIR UN JEU</h1>
</div>

<!-- Grille des jeux -->
<div class="grid">

    <!-- 🐍 Snake -->
    <a href="snake.html" class="card green">
        <div class="preview snake-preview"></div>
        <div class="name">🐍 SNAKE</div>
        <div class="stars">★ ☆ ☆ ☆ ☆</div>
        <div class="play-badge"><span>▶ PLAY</span></div>
    </a>

    <!-- 👾 Neon Invaders -->
    <a href="neon-invaders.html" class="card blue">
        <div class="preview invader-preview"></div>
        <div class="name">👾 NEON INVADERS</div>
        <div class="stars">★ ☆ ☆ ☆ ☆</div>
        <div class="play-badge"><span>▶ PLAY</span></div>
    </a>

    <!-- ♟️ Échecs -->
    <a href="echec.html" class="card red">
        <div class="preview echec-preview"></div>
        <div class="name">♟️ NEON CHESS</div>
        <div class="stars">★ ☆ ☆ ☆ ☆</div>
        <div class="play-badge"><span>▶ PLAY</span></div>
    </a>

    <!-- ⭕ Morpion -->
    <a href="morpion.html" class="card purple">
        <div class="preview morpion-preview"></div>
        <div class="name">⭕ MORPION</div>
        <div class="stars">★ ☆ ☆ ☆ ☆</div>
        <div class="play-badge"><span>▶ PLAY</span></div>
    </a>

    <!-- 🏓 Pong Neon -->
    <a href="pong-neon.html" class="card yellow">
        <div class="preview pong-neon-preview"></div>
        <div class="name">🏓 PONG NEON</div>
        <div class="stars">★ ☆ ☆ ☆ ☆</div>
        <div class="play-badge"><span>▶ PLAY</span></div>
    </a>

    <!-- ⚫ Puissance 4 -->
    <a href="puissance-4.html" class="card orange">
        <div class="preview puissance-4-preview"></div>
        <div class="name">⚫ PUISSANCE 4</div>
        <div class="stars">★ ☆ ☆ ☆ ☆</div>
        <div class="play-badge"><span>▶ PLAY</span></div>
    </a>

    <!-- 🧱 Casse-Brique -->
    <a href="casse-brique.html" class="card pink">
        <div class="preview cassebrique-preview"></div>
        <div class="name">🧱 CASSE-BRIQUE</div>
        <div class="stars">★ ☆ ☆ ☆ ☆</div>
        <div class="play-badge"><span>▶ PLAY</span></div>
    </a>

</div>

<!-- Pied de page -->
<div class="footer">
    © 2026 <span>COOKAI GAMES</span> — POWERED BY NEON ◆
</div>

<script>
// Génération des particules néon
const colors = ['#4ade80', '#22d3ee', '#a855f7', '#f87171'];
const particlesContainer = document.getElementById('particles');

function createParticle() {
    const particle = document.createElement('div');
    particle.classList.add('particle');
    
    const color = colors[Math.floor(Math.random() * colors.length)];
    const size = Math.random() * 4 + 2;
    const left = Math.random() * 100;
    const duration = Math.random() * 15 + 10;
    const delay = Math.random() * 5;
    
    particle.style.background = color;
    particle.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
    particle.style.width = size + 'px';
    particle.style.height = size + 'px';
    particle.style.left = left + '%';
    particle.style.animationDuration = duration + 's';
    particle.style.animationDelay = delay + 's';
    
    particlesContainer.appendChild(particle);
    
    setTimeout(() => particle.remove(), (duration + delay) * 1000);
}

// Créer des particules en continu
for (let i = 0; i < 25; i++) {
    setTimeout(createParticle, i * 300);
}
setInterval(createParticle, 600);

// Effet de tilt 3D au survol des cartes
document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = (y - centerY) / 15;
        const rotateY = (centerX - x) / 15;
        
        card.style.transform = `translateY(-8px) scale(1.03) perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });
    
    card.addEventListener('mouseleave', () => {
        card.style.transform = '';
    });
});
</script>

</body>
</html>
