<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎮 Cookai Games</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    text-align: center;
}

/* Titre */
h1 {
    margin-top: 40px;
    color: #4ade80;
    text-shadow: 0 0 15px #4ade80;
}

/* Grille */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    max-width: 400px;
    margin: 40px auto;
}

/* Carte */
.card {
    border: 2px solid #4ade80;
    border-radius: 15px;
    padding: 20px;
    transition: 0.3s;
    text-decoration: none;
    color: white;
}

/* Hover */
.card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #4ade80;
}

/* Aperçu */
.preview {
    width: 100px;
    height: 100px;
    margin: auto;
    border: 2px solid #4ade80;
    border-radius: 10px;
    margin-bottom: 10px;
    position: relative;
}

/* 🐍 Snake dessin */
.snake-preview::before {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    background: #4ade80;
    box-shadow:
        15px 0 #4ade80,
        30px 0 #4ade80,
        30px 15px #4ade80,
        30px 30px #4ade80;
}

/* tête */
.snake-preview::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    background: lime;
    left: 30px;
    top: 30px;
    border-radius: 2px;
}

/* Nom */
.name {
    font-weight: bold;
    margin-top: 10px;
}

/* Étoiles */
.stars {
    margin-top: 5px;
    color: gold;
}
</style>
</head>

<body>

<h1>🗺️ Choisir un jeu</h1>

<div class="grid">

    <a href="snake.html" class="card">
        <div class="preview snake-preview"></div>
        <div class="name">🐍 Snake</div>
        <div class="stars">⭐</div>
    </a>

</div>

</body>
</html>
