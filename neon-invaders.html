<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON INVADERS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #000;
    color: #0ff;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  h1 {
    margin: 10px 0;
    text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
    letter-spacing: 4px;
    font-size: 24px;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    max-width: 700px;
  }
  canvas {
    display: block;
    background: #000;
    border: 2px solid #0ff;
    box-shadow: 0 0 20px #0ff;
    width: 100%;
    height: auto;
  }
  #hud {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    padding: 8px;
    background: rgba(0,255,255,0.05);
    border: 1px solid #0ff;
    margin-top: 6px;
    font-size: 14px;
    gap: 6px;
  }
  #hud > div { padding: 2px 6px; }
  #combo { color: #ff0; }
  #powerup { color: #f0f; }
  .controls {
    margin-top: 6px;
    font-size: 12px;
    opacity: 0.8;
    text-align: center;
  }
  #touchControls {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 700px;
    padding: 10px;
    gap: 10px;
  }
  .touchBtn {
    flex: 1;
    padding: 18px;
    background: rgba(0,255,255,0.15);
    border: 2px solid #0ff;
    color: #0ff;
    font-size: 22px;
    font-family: inherit;
    border-radius: 8px;
    cursor: pointer;
  }
  .touchBtn:active { background: rgba(0,255,255,0.4); }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
    text-align: center;
    overflow-y: auto;
  }
  #overlay.hidden { display: none; }
  #overlay h2 {
    color: #0ff;
    text-shadow: 0 0 10px #0ff;
    margin-bottom: 14px;
    font-size: 28px;
    letter-spacing: 3px;
  }
  #overlay button {
    margin-top: 18px;
    padding: 12px 30px;
    background: #0ff;
    color: #000;
    border: none;
    font-size: 18px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    border-radius: 6px;
    box-shadow: 0 0 15px #0ff;
  }
  .section-title {
    color: #ff0;
    margin: 14px 0 6px;
    font-size: 16px;
    letter-spacing: 2px;
  }
  table { border-collapse: collapse; margin: 0 auto; }
  td { padding: 3px 12px; font-size: 14px; }
  .legend { font-size: 12px; opacity: 0.85; line-height: 1.8; }
  .legend span { display: inline-block; margin: 0 6px; }
  #soundToggle {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #0ff;
    color: #0ff;
    padding: 4px 8px;
    font-family: inherit;
    cursor: pointer;
    z-index: 5;
    font-size: 12px;
  }
</style>
</head>
<body>
  <h1>◤ NEON INVADERS ◢</h1>
  <div id="gameContainer">
    <canvas id="game" width="500" height="600"></canvas>
    <button id="soundToggle">🔊</button>
    <div id="hud">
      <div>SCORE: <span id="score">0</span></div>
      <div>HI: <span id="hiscore">0</span></div>
      <div>♥ <span id="lives">3</span></div>
      <div>LVL: <span id="level">1</span></div>
      <div id="combo">x<span id="comboVal">1</span></div>
      <div id="powerup">—</div>
    </div>
  </div>
  <div id="touchControls">
    <button class="touchBtn" id="leftBtn">◄</button>
    <button class="touchBtn" id="rightBtn">►</button>
  </div>

  <div id="overlay"></div>

<script>
// ========= CANVAS =========
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ========= STATE =========
let state = {};
let player, bullets, enemyBullets, enemies, particles, powerups, ufo, stars, floatTexts, shields;
let keys = {};
let lastTime = 0;
let scores = [];
let soundEnabled = true;
let audioCtx = null;

const overlay = document.getElementById('overlay');
const leftBtn = document.getElementById('leftBtn');
const rightBtn = document.getElementById('rightBtn');
const soundToggleBtn = document.getElementById('soundToggle');

// ========= AUDIO =========
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { soundEnabled = false; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  if (!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  
  switch(type) {
    case 'shoot':
      o.type = 'square'; o.frequency.setValueAtTime(880, now);
      o.frequency.exponentialRampToValueAtTime(220, now + 0.1);
      g.gain.setValueAtTime(0.08, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      o.start(now); o.stop(now + 0.1); break;
    case 'explosion':
      o.type = 'sawtooth'; o.frequency.setValueAtTime(150, now);
      o.frequency.exponentialRampToValueAtTime(40, now + 0.3);
      g.gain.setValueAtTime(0.15, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      o.start(now); o.stop(now + 0.3); break;
    case 'hit':
      o.type = 'triangle'; o.frequency.setValueAtTime(200, now);
      g.gain.setValueAtTime(0.12, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      o.start(now); o.stop(now + 0.15); break;
    case 'powerup':
      o.type = 'sine'; o.frequency.setValueAtTime(440, now);
      o.frequency.linearRampToValueAtTime(880, now + 0.2);
      g.gain.setValueAtTime(0.12, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      o.start(now); o.stop(now + 0.2); break;
    case 'ufo':
      o.type = 'sine'; o.frequency.setValueAtTime(600, now);
      o.frequency.linearRampToValueAtTime(800, now + 0.1);
      o.frequency.linearRampToValueAtTime(600, now + 0.2);
      g.gain.setValueAtTime(0.1, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      o.start(now); o.stop(now + 0.3); break;
    case 'life':
      o.type = 'sine'; o.frequency.setValueAtTime(523, now);
      o.frequency.setValueAtTime(659, now + 0.1);
      o.frequency.setValueAtTime(784, now + 0.2);
      g.gain.setValueAtTime(0.15, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      o.start(now); o.stop(now + 0.4); break;
    case 'levelup':
      o.type = 'square'; o.frequency.setValueAtTime(440, now);
      o.frequency.setValueAtTime(554, now + 0.1);
      o.frequency.setValueAtTime(659, now + 0.2);
      o.frequency.setValueAtTime(880, now + 0.3);
      g.gain.setValueAtTime(0.12, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      o.start(now); o.stop(now + 0.5); break;
  }
}

// ========= STARS =========
function initStars() {
  stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      speed: 0.3 + Math.random() * 1.5,
      size: Math.random() * 1.5 + 0.3
    });
  }
}

// ========= GAME RESET =========
function resetGame() {
  state = {
    score: 0,
    lives: 3,
    level: 1,
    combo: 1,
    comboTimer: 0,
    powerup: null,
    powerupTimer: 0,
    shake: 0,
    flash: 0,
    paused: false,
    gameOver: false,
    autoShootTimer: 0,
    ufoTimer: 600 + Math.random() * 600
  };
  player = { x: W/2 - 20, y: H - 60, w: 40, h: 30, speed: 5 };
  bullets = [];
  enemyBullets = [];
  enemies = [];
  particles = [];
  powerups = [];
  floatTexts = [];
  ufo = null;
  initShields();
  initLevel();
  updateHUD();
}

function initShields() {
  shields = [];
  const count = 4;
  const spacing = W / (count + 1);
  for (let i = 0; i < count; i++) {
    const sx = spacing * (i + 1) - 30;
    const sy = H - 130;
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 6; col++) {
        if (row === 2 && col > 0 && col < 5) continue;
        shields.push({
          x: sx + col * 10,
          y: sy + row * 8,
          w: 10, h: 8,
          hp: 3
        });
      }
    }
  }
}

function initLevel() {
  enemies = [];
  const rows = 5;
  const cols = 10;
  const ox = 40, oy = 50, gx = 40, gy = 32;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      enemies.push({
        x: ox + c * gx,
        y: oy + r * gy,
        w: 26, h: 20,
        type: r === 0 ? 3 : r < 2 ? 2 : r < 4 ? 1 : 0,
        hp: r === 0 ? 2 : 1,
        maxHp: r === 0 ? 2 : 1,
        alive: true,
        anim: 0
      });
    }
  }
  state.enemyDir = 1;
  state.enemySpeed = 0.4 + state.level * 0.15;
  state.enemyShootRate = Math.max(0.005, 0.02 - state.level * 0.001);
}
// ========= POWERUPS =========
const POWERUPS = {
  RAPID:  { color: '#ff0', symbol: 'R', name: 'TIR RAPIDE' },
  TRIPLE: { color: '#0f0', symbol: 'T', name: 'TRIPLE TIR' },
  SHIELD: { color: '#0af', symbol: 'S', name: 'BOUCLIER' },
  LIFE:   { color: '#f0f', symbol: '♥', name: 'VIE EXTRA' }
};
const POWERUP_KEYS = Object.keys(POWERUPS);

function spawnPowerup(x, y, forceKey) {
  const key = forceKey || POWERUP_KEYS[Math.floor(Math.random() * POWERUP_KEYS.length)];
  powerups.push({ x, y, w: 20, h: 20, key, vy: 1.5 });
}

function applyPowerup(key) {
  const p = POWERUPS[key];
  playSound(key === 'LIFE' ? 'life' : 'powerup');
  spawnFloatText(player.x + player.w/2, player.y, p.name, p.color);
  if (key === 'LIFE') {
    state.lives++;
  } else {
    state.powerup = key;
    state.powerupTimer = 600;
  }
  updateHUD();
}

// ========= EFFECTS =========
function spawnParticles(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 30 + Math.random() * 20,
      maxLife: 50,
      color,
      size: 1 + Math.random() * 2.5
    });
  }
}
function spawnFloatText(x, y, text, color) {
  floatTexts.push({ x, y, text, color, life: 60 });
}
function shake(amt) { state.shake = Math.max(state.shake, amt); }
function flash() { state.flash = 1; }

// ========= SHOOT =========
function autoShoot() {
  const cx = player.x + player.w/2;
  const cy = player.y;
  playSound('shoot');
  if (state.powerup === 'TRIPLE') {
    bullets.push({ x: cx - 2, y: cy, w: 4, h: 12, vy: -8 });
    bullets.push({ x: cx - 14, y: cy + 4, w: 4, h: 12, vy: -8, vx: -1.2 });
    bullets.push({ x: cx + 10, y: cy + 4, w: 4, h: 12, vy: -8, vx: 1.2 });
  } else {
    bullets.push({ x: cx - 2, y: cy, w: 4, h: 12, vy: -8 });
  }
}

// ========= COLLISIONS =========
function hit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ========= UPDATE =========
function update() {
  if (state.paused || state.gameOver) return;

  // Stars
  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  });

  if (state.shake > 0) state.shake *= 0.85;
  if (state.shake < 0.1) state.shake = 0;
  if (state.flash > 0) state.flash -= 0.08;

  // Player
  if (keys.left) player.x -= player.speed;
  if (keys.right) player.x += player.speed;
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  // Auto-shoot
  state.autoShootTimer--;
  const fireRate = state.powerup === 'RAPID' ? 8 : 18;
  if (state.autoShootTimer <= 0) {
    autoShoot();
    state.autoShootTimer = fireRate;
  }

  // Powerup timer
  if (state.powerupTimer > 0) {
    state.powerupTimer--;
    if (state.powerupTimer === 0) state.powerup = null;
  }

  // Combo timer
  if (state.comboTimer > 0) {
    state.comboTimer--;
    if (state.comboTimer === 0) state.combo = 1;
  }

  // Bullets (player)
  bullets.forEach(b => { b.y += b.vy; if (b.vx) b.x += b.vx; });
  bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20);

  // Enemy bullets
  enemyBullets.forEach(b => b.y += b.vy);
  enemyBullets = enemyBullets.filter(b => b.y < H + 20);

  // Enemies movement
  let edge = false;
  enemies.forEach(e => {
    if (!e.alive) return;
    e.x += state.enemySpeed * state.enemyDir;
    e.anim += 0.05;
    if (e.x < 5 || e.x + e.w > W - 5) edge = true;
  });
  if (edge) {
    state.enemyDir *= -1;
    enemies.forEach(e => { if (e.alive) e.y += 14; });
  }

  // Enemy shooting
  enemies.forEach(e => {
    if (!e.alive) return;
    if (Math.random() < state.enemyShootRate) {
      enemyBullets.push({ x: e.x + e.w/2 - 2, y: e.y + e.h, w: 4, h: 10, vy: 3 + state.level * 0.2 });
    }
  });

  // UFO
  state.ufoTimer--;
  if (state.ufoTimer <= 0 && !ufo) {
    ufo = { x: -40, y: 30, w: 40, h: 18, vx: 2.5 };
    playSound('ufo');
    state.ufoTimer = 800 + Math.random() * 600;
  }
  if (ufo) {
    ufo.x += ufo.vx;
    if (ufo.x > W + 40) ufo = null;
  }

  // Bullet vs enemies
  bullets.forEach(b => {
    enemies.forEach(e => {
      if (e.alive && hit(b, e)) {
        b.y = -100;
        e.hp--;
        if (e.hp <= 0) {
          e.alive = false;
          const pts = (10 + e.type * 10) * state.combo;
          state.score += pts;
          state.combo = Math.min(10, state.combo + 1);
          state.comboTimer = 120;
          spawnParticles(e.x + e.w/2, e.y + e.h/2, ['#f0f','#ff0','#0f0','#f80'][e.type], 14);
          spawnFloatText(e.x + e.w/2, e.y, '+' + pts, '#ff0');
          playSound('explosion');
          if (Math.random() < 0.08) spawnPowerup(e.x + e.w/2, e.y);
        } else {
          playSound('hit');
          spawnParticles(b.x, b.y, '#fff', 4);
        }
        updateHUD();
      }
    });
  });

  // Bullet vs UFO
  if (ufo) {
    bullets.forEach(b => {
      if (hit(b, ufo)) {
        b.y = -100;
        const pts = 200 * state.combo;
        state.score += pts;
        spawnParticles(ufo.x + ufo.w/2, ufo.y + ufo.h/2, '#f0f', 25);
        spawnFloatText(ufo.x + ufo.w/2, ufo.y, '+' + pts, '#f0f');
        spawnPowerup(ufo.x + ufo.w/2, ufo.y);
        playSound('explosion');
        shake(6);
        ufo = null;
        updateHUD();
      }
    });
  }

  // Bullets vs shields
  bullets.forEach(b => {
    shields.forEach(s => {
      if (s.hp > 0 && hit(b, s)) {
        b.y = -100; s.hp--;
        spawnParticles(b.x, b.y, '#0f0', 4);
      }
    });
  });
  enemyBullets.forEach(b => {
    shields.forEach(s => {
      if (s.hp > 0 && hit(b, s)) {
        b.y = H + 100; s.hp--;
        spawnParticles(b.x, b.y, '#0f0', 4);
      }
    });
  });

  // Enemy bullets vs player
  enemyBullets.forEach(b => {
    if (hit(b, player)) {
      b.y = H + 100;
      if (state.powerup === 'SHIELD') {
        state.powerup = null;
        state.powerupTimer = 0;
        spawnFloatText(player.x + player.w/2, player.y, 'BOUCLIER!', '#0af');
        spawnParticles(player.x + player.w/2, player.y + player.h/2, '#0af', 20);
      } else {
        state.lives--;
        flash(); shake(10);
        spawnParticles(player.x + player.w/2, player.y + player.h/2, '#f00', 20);
        playSound('explosion');
        state.combo = 1;
        if (state.lives <= 0) gameOver();
      }
      updateHUD();
    }
  });

  // Enemies reach player
  enemies.forEach(e => {
    if (e.alive && e.y + e.h >= player.y) gameOver();
  });

  // Powerups falling
  powerups.forEach(p => p.y += p.vy);
  powerups = powerups.filter(p => {
    if (hit(p, player)) { applyPowerup(p.key); return false; }
    return p.y < H + 20;
  });

  // Particles
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);

  // Float texts
  floatTexts.forEach(t => { t.y -= 0.8; t.life--; });
  floatTexts = floatTexts.filter(t => t.life > 0);

  // Level complete
  if (enemies.every(e => !e.alive)) {
    state.level++;
    const bonus = 100 * state.level;
    state.score += bonus;
    spawnFloatText(W/2, H/2, 'NIVEAU ' + state.level + ' +' + bonus, '#0ff');
    playSound('levelup');
    initLevel();
    initShields();
    updateHUD();
  }
}

// ========= DRAW =========
function draw() {
  ctx.save();
  if (state.shake > 0) {
    ctx.translate((Math.random()-0.5)*state.shake, (Math.random()-0.5)*state.shake);
  }
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Stars
  stars.forEach(s => {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + s.speed/2) + ')';
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });

  // Shields
  shields.forEach(s => {
    if (s.hp <= 0) return;
    ctx.fillStyle = s.hp === 3 ? '#0f0' : s.hp === 2 ? '#ff0' : '#f80';
    ctx.fillRect(s.x, s.y, s.w, s.h);
  });

  // Player
  ctx.fillStyle = state.powerup === 'SHIELD' ? '#0af' : '#0ff';
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
  ctx.fillRect(player.x + 16, player.y, 8, 10);
  ctx.fillRect(player.x + 4, player.y + 10, 32, 12);
  ctx.fillRect(player.x, player.y + 18, 40, 8);
  // Reacteurs
  ctx.fillStyle = '#ff0';
  ctx.fillRect(player.x + 8, player.y + 26, 4, 4 + Math.random()*4);
  ctx.fillRect(player.x + 28, player.y + 26, 4, 4 + Math.random()*4);
  ctx.shadowBlur = 0;
  if (state.powerup === 'SHIELD') {
    ctx.strokeStyle = '#0af'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x + player.w/2, player.y + player.h/2, 28, 0, Math.PI*2);
    ctx.stroke();
  }

  // Bullets
  ctx.fillStyle = '#0ff';
  ctx.shadowColor = '#0ff'; ctx.shadowBlur = 8;
  bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
  ctx.shadowBlur = 0;

  // Enemy bullets
  ctx.fillStyle = '#f44';
  ctx.shadowColor = '#f00'; ctx.shadowBlur = 6;
  enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
  ctx.shadowBlur = 0;

  // Enemies
  const colors = ['#f80', '#0f0', '#ff0', '#f0f'];
  enemies.forEach(e => {
    if (!e.alive) return;
    ctx.fillStyle = colors[e.type];
    ctx.shadowColor = colors[e.type]; ctx.shadowBlur = 8;
    const wobble = Math.sin(e.anim) > 0 ? 1 : 0;
    ctx.fillRect(e.x + 4, e.y, e.w - 8, 6);
    ctx.fillRect(e.x, e.y + 6, e.w, 8);
    ctx.fillRect(e.x + 2 + wobble*2, e.y + 14, 6, 6);
    ctx.fillRect(e.x + e.w - 8 - wobble*2, e.y + 14, 6, 6);
    ctx.shadowBlur = 0;
    // HP bar
    if (e.maxHp > 1) {
      ctx.fillStyle = '#400';
      ctx.fillRect(e.x, e.y - 4, e.w, 2);
      ctx.fillStyle = '#f00';
      ctx.fillRect(e.x, e.y - 4, e.w * (e.hp/e.maxHp), 2);
    }
  });

  // UFO
  if (ufo) {
    ctx.fillStyle = '#f0f';
    ctx.shadowColor = '#f0f'; ctx.shadowBlur = 15;
    ctx.fillRect(ufo.x + 8, ufo.y, ufo.w - 16, 6);
    ctx.fillRect(ufo.x, ufo.y + 6, ufo.w, 8);
    ctx.fillRect(ufo.x + 4, ufo.y + 14, ufo.w - 8, 4);
    ctx.shadowBlur = 0;
  }

  // Powerups
  powerups.forEach(p => {
    const def = POWERUPS[p.key];
    ctx.fillStyle = def.color;
    ctx.shadowColor = def.color; ctx.shadowBlur = 10;
    ctx.fillRect(p.x - p.w/2, p.y, p.w, p.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(def.symbol, p.x, p.y + 15);
  });

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  // Float texts
  floatTexts.forEach(t => {
    ctx.globalAlpha = Math.min(1, t.life / 30);
    ctx.fillStyle = t.color;
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
  });
  ctx.globalAlpha = 1;

  // Flash
  if (state.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + state.flash + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();

  // Pause overlay
  if (state.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 32px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSE', W/2, H/2);
  }
}

// ========= HUD =========
function updateHUD() {
  document.getElementById('score').textContent = state.score;
  document.getElementById('lives').textContent = state.lives;
  document.getElementById('level').textContent = state.level;
  document.getElementById('comboVal').textContent = state.combo;
  document.getElementById('hiscore').textContent = scores[0] ? scores[0].score : 0;
  const pu = document.getElementById('powerup');
  if (state.powerup) {
    pu.textContent = POWERUPS[state.powerup].symbol + ' ' + Math.ceil(state.powerupTimer/60) + 's';
    pu.style.color = POWERUPS[state.powerup].color;
  } else {
    pu.textContent = '—';
    pu.style.color = '#f0f';
  }
}

// ========= SCORES =========
function loadScores() {
  try { scores = JSON.parse(localStorage.getItem('neonInvadersScores') || '[]'); }
  catch(e) { scores = []; }
}
function saveScore(s) {
  scores.push({ score: s, date: new Date().toLocaleDateString() });
  scores.sort((a,b) => b.score - a.score);
  scores = scores.slice(0, 10);
  try { localStorage.setItem('neonInvadersScores', JSON.stringify(scores)); } catch(e) {}
}
function buildScoreTable() {
  if (!scores.length) return '<p style="opacity:0.6">Aucun score</p>';
  let html = '<table>';
  scores.forEach((s, i) => {
    html += `<tr><td>${i+1}.</td><td>${s.score}</td><td style="opacity:0.6">${s.date}</td></tr>`;
  });
  html += '</table>';
  return html;
}

// ========= SCREENS =========
function showStartScreen() {
  overlay.innerHTML = `
    <h2>◤ NEON INVADERS ◢</h2>
    <p>Tir automatique — concentre-toi sur l'esquive !</p>
    <div class="section-title">◂ POWER-UPS ▸</div>
    <div class="legend">
      <span style="color:#ff0">R = TIR RAPIDE</span>
      <span style="color:#0f0">T = TRIPLE TIR</span>
      <span style="color:#0af">S = BOUCLIER</span>
      <span style="color:#f0f">♥ = VIE EXTRA</span>
    </div>
    <p class="controls">🖥️ ← → bouger | P = pause</p>
    <p class="controls">📱 Boutons tactiles</p>
    <p class="controls">⚡ Combos = plus de points | 🛸 UFO = bonus garanti</p>
    <div class="section-title">◂ MEILLEURS SCORES ▸</div>
    ${buildScoreTable()}
    <button id="startBtn">DÉMARRER</button>
  `;
  overlay.classList.remove('hidden');
  document.getElementById('startBtn').addEventListener('click', () => {
    initAudio();
    overlay.classList.add('hidden');
    resetGame();
  });
}

function gameOver() {
  if (state.gameOver) return;
  state.gameOver = true;
  saveScore(state.score);
  overlay.innerHTML = `
    <h2>GAME OVER</h2>
    <p style="font-size:20px;color:#ff0">SCORE: ${state.score}</p>
    <p>Niveau atteint: ${state.level}</p>
    <div class="section-title">◂ MEILLEURS SCORES ▸</div>
    ${buildScoreTable()}
    <button id="restartBtn">REJOUER</button>
  `;
  overlay.classList.remove('hidden');
  document.getElementById('restartBtn').addEventListener('click', () => {
    overlay.classList.add('hidden');
    resetGame();
  });
}

// ========= LOOP =========
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ========= INPUT =========
window.addEventListener('keydown', e => {
  initAudio();
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === 'p' || e.key === 'P') state.paused = !state.paused;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

function bindBtn(btn, key) {
  ['touchstart','mousedown'].forEach(ev => btn.addEventListener(ev, e => { e.preventDefault(); initAudio(); keys[key] = true; }));
  ['touchend','mouseup','mouseleave','touchcancel'].forEach(ev => btn.addEventListener(ev, e => { e.preventDefault(); keys[key] = false; }));
}
bindBtn(leftBtn, 'left');
bindBtn(rightBtn, 'right');

soundToggleBtn.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  soundToggleBtn.textContent = soundEnabled ? '🔊' : '🔇';
  if (soundEnabled) initAudio();
});

// ========= INIT =========
loadScores();
initStars();
showStartScreen();
loop();
</script>
