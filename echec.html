<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Chess</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #0a0a15;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(255, 0, 255, 0.15), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.15), transparent 50%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    padding: 20px;
    color: #fff;
    overflow-x: hidden;
  }

  h1 {
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    margin-bottom: 15px;
    color: #fff;
    text-shadow: 
      0 0 5px #ff00ff,
      0 0 10px #ff00ff,
      0 0 20px #ff00ff,
      0 0 40px #ff00ff;
    letter-spacing: 4px;
    animation: flicker 3s infinite alternate;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.95; }
  }

  .info-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 560px;
    margin-bottom: 12px;
    font-size: 0.9rem;
    color: #0ff;
    text-shadow: 0 0 8px #0ff;
    letter-spacing: 2px;
  }

  .status {
    color: #ff0;
    text-shadow: 0 0 8px #ff0;
  }

  #board-container {
    position: relative;
    padding: 12px;
    background: linear-gradient(135deg, #0a0a15, #1a0a25);
    border-radius: 8px;
    box-shadow: 
      0 0 20px rgba(255, 0, 255, 0.6),
      0 0 40px rgba(0, 255, 255, 0.4),
      inset 0 0 20px rgba(0, 0, 0, 0.8);
  }

  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: min(90vw, 560px);
    height: min(90vw, 560px);
    border: 2px solid #ff00ff;
    box-shadow: 
      0 0 10px #ff00ff,
      inset 0 0 10px rgba(255, 0, 255, 0.3);
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(8vw, 44px);
    cursor: pointer;
    position: relative;
    transition: all 0.2s;
    user-select: none;
  }

  .light {
    background: rgba(100, 50, 150, 0.3);
  }

  .dark {
    background: rgba(20, 10, 40, 0.6);
  }

  .cell:hover {
    background: rgba(0, 255, 255, 0.2);
    box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.5);
  }

  .white-piece {
    color: #fff;
    text-shadow: 
      0 0 5px #0ff,
      0 0 10px #0ff,
      0 0 15px #0ff;
  }

  .black-piece {
    color: #ff4fff;
    text-shadow: 
      0 0 5px #ff00ff,
      0 0 10px #ff00ff,
      0 0 15px #ff00ff;
  }

  .selected {
    background: rgba(255, 255, 0, 0.3) !important;
    box-shadow: 
      inset 0 0 20px #ff0,
      0 0 15px #ff0 !important;
  }

  .last-move {
    background: rgba(255, 0, 255, 0.35) !important;
    animation: pulse 1.5s infinite;
    box-shadow: inset 0 0 20px rgba(255, 0, 255, 0.8) !important;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: inset 0 0 15px rgba(255, 0, 255, 0.5); }
    50% { box-shadow: inset 0 0 30px rgba(255, 0, 255, 1), 0 0 15px rgba(255, 0, 255, 0.8); }
  }

  .valid-move::after {
    content: '';
    position: absolute;
    width: 30%;
    height: 30%;
    border-radius: 50%;
    background: radial-gradient(circle, #0ff, transparent);
    box-shadow: 0 0 15px #0ff;
    animation: glow 1s infinite alternate;
  }

  .valid-capture {
    box-shadow: 
      inset 0 0 0 3px #f0f,
      inset 0 0 20px rgba(255, 0, 255, 0.5) !important;
  }

  @keyframes glow {
    0% { opacity: 0.5; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1.1); }
  }

  .check {
    animation: shake 0.5s infinite;
    background: rgba(255, 0, 0, 0.4) !important;
    box-shadow: inset 0 0 20px #f00 !important;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }

  .controls {
    margin-top: 20px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    background: transparent;
    border: 2px solid #0ff;
    color: #0ff;
    padding: 10px 20px;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s;
    text-shadow: 0 0 5px #0ff;
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1);
  }

  button:hover {
    background: rgba(0, 255, 255, 0.2);
    box-shadow: 0 0 20px #0ff, inset 0 0 10px rgba(0, 255, 255, 0.3);
    color: #fff;
  }

  button.magenta {
    border-color: #f0f;
    color: #f0f;
    text-shadow: 0 0 5px #f0f;
    box-shadow: 0 0 10px rgba(255, 0, 255, 0.3), inset 0 0 10px rgba(255, 0, 255, 0.1);
  }

  button.magenta:hover {
    background: rgba(255, 0, 255, 0.2);
    box-shadow: 0 0 20px #f0f, inset 0 0 10px rgba(255, 0, 255, 0.3);
    color: #fff;
  }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .modal.active { display: flex; }

  .modal-content {
    background: #0a0a15;
    border: 2px solid #f0f;
    box-shadow: 0 0 30px #f0f, inset 0 0 20px rgba(255, 0, 255, 0.2);
    padding: 30px;
    border-radius: 8px;
    text-align: center;
    max-width: 90%;
  }

  .modal-content h2 {
    color: #0ff;
    text-shadow: 0 0 10px #0ff;
    margin-bottom: 20px;
    letter-spacing: 3px;
  }

  .promotion-pieces {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .promotion-piece {
    font-size: 40px;
    padding: 10px;
    cursor: pointer;
    border: 2px solid #0ff;
    border-radius: 8px;
    transition: all 0.3s;
    min-width: 60px;
  }

  .promotion-piece:hover {
    background: rgba(0, 255, 255, 0.2);
    box-shadow: 0 0 15px #0ff;
    transform: scale(1.1);
  }

  .captured {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
    min-height: 24px;
    font-size: 20px;
  }

  .captured-row {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 560px;
    padding: 5px 10px;
  }

  .coord {
    position: absolute;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.4);
    pointer-events: none;
  }

  .coord.file { bottom: 2px; right: 3px; }
  .coord.rank { top: 2px; left: 3px; }
</style>
</head>
<body>
  <h1>⚡ NEON CHESS ⚡</h1>
  
  <div class="info-bar">
    <span>TOUR: <span id="turn" class="status">BLANC</span></span>
    <span id="message" class="status">À VOUS DE JOUER</span>
  </div>

  <div class="captured-row">
    <div id="captured-white" class="captured"></div>
  </div>

  <div id="board-container">
    <div id="board"></div>
  </div>

  <div class="captured-row">
    <div id="captured-black" class="captured"></div>
  </div>

  <div class="controls">
    <button onclick="newGame()">Nouvelle partie</button>
    <button class="magenta" onclick="toggleSound()"><span id="sound-label">🔊 Son ON</span></button>
    <button onclick="undoMove()">Annuler</button>
  </div>

  <div id="promotion-modal" class="modal">
    <div class="modal-content">
      <h2>PROMOTION</h2>
      <div id="promotion-pieces" class="promotion-pieces"></div>
    </div>
  </div>

  <div id="end-modal" class="modal">
    <div class="modal-content">
      <h2 id="end-title">ÉCHEC ET MAT</h2>
      <p id="end-message" style="margin-bottom: 20px; color: #fff;"></p>
      <button onclick="newGame(); document.getElementById('end-modal').classList.remove('active');">Rejouer</button>
    </div>
  </div>

<script>
// ============ CHESS LOGIC ============

const PIECES = {
  'wK': '♔', 'wQ': '♕', 'wR': '♖', 'wB': '♗', 'wN': '♘', 'wP': '♙',
  'bK': '♚', 'bQ': '♛', 'bR': '♜', 'bB': '♝', 'bN': '♞', 'bP': '♟'
};

let board = [];
let currentPlayer = 'w';
let selected = null;
let validMoves = [];
let lastMove = null; // {from: [r,c], to: [r,c]}
let history = [];
let castlingRights = { wK: true, wQ: true, bK: true, bQ: true };
let enPassantTarget = null;
let soundEnabled = true;
let gameOver = false;
let capturedWhite = [];
let capturedBlack = [];
let pendingPromotion = null;

function initBoard() {
  board = [
    ['bR','bN','bB','bQ','bK','bB','bN','bR'],
    ['bP','bP','bP','bP','bP','bP','bP','bP'],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    ['wP','wP','wP','wP','wP','wP','wP','wP'],
    ['wR','wN','wB','wQ','wK','wB','wN','wR']
  ];
  currentPlayer = 'w';
  selected = null;
  validMoves = [];
  lastMove = null;
  history = [];
  castlingRights = { wK: true, wQ: true, bK: true, bQ: true };
  enPassantTarget = null;
  gameOver = false;
  capturedWhite = [];
  capturedBlack = [];
  pendingPromotion = null;
}

function inBounds(r, c) {
  return r >= 0 && r < 8 && c >= 0 && c < 8;
}

function getPieceColor(piece) {
  return piece ? piece[0] : null;
}

function getPieceType(piece) {
  return piece ? piece[1] : null;
}

// Generate pseudo-legal moves (without check check)
function getPieceMoves(r, c, brd, epTarget, castling) {
  const piece = brd[r][c];
  if (!piece) return [];
  const color = piece[0];
  const type = piece[1];
  const moves = [];

  const addMove = (tr, tc, flags={}) => {
    if (!inBounds(tr, tc)) return;
    const target = brd[tr][tc];
    if (target && target[0] === color) return;
    moves.push({ from: [r,c], to: [tr,tc], capture: !!target, ...flags });
  };

  if (type === 'P') {
    const dir = color === 'w' ? -1 : 1;
    const startRow = color === 'w' ? 6 : 1;
    const promoRow = color === 'w' ? 0 : 7;
    
    // Forward 1
    if (inBounds(r+dir, c) && !brd[r+dir][c]) {
      if (r+dir === promoRow) {
        moves.push({ from: [r,c], to: [r+dir,c], promotion: true });
      } else {
        moves.push({ from: [r,c], to: [r+dir,c] });
      }
      // Forward 2
      if (r === startRow && !brd[r+2*dir][c]) {
        moves.push({ from: [r,c], to: [r+2*dir,c], doublePush: true });
      }
    }
    // Captures
    for (const dc of [-1, 1]) {
      const tr = r+dir, tc = c+dc;
      if (!inBounds(tr, tc)) continue;
      const target = brd[tr][tc];
      if (target && target[0] !== color) {
        if (tr === promoRow) {
          moves.push({ from:[r,c], to:[tr,tc], capture:true, promotion:true });
        } else {
          moves.push({ from:[r,c], to:[tr,tc], capture:true });
        }
      }
      // En passant
      if (epTarget && epTarget[0] === tr && epTarget[1] === tc) {
        moves.push({ from:[r,c], to:[tr,tc], capture:true, enPassant:true });
      }
    }
  }

  if (type === 'N') {
    const deltas = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
    for (const [dr,dc] of deltas) addMove(r+dr, c+dc);
  }

  if (type === 'B' || type === 'Q') {
    const dirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
    for (const [dr,dc] of dirs) {
      for (let i=1; i<8; i++) {
        const tr = r+dr*i, tc = c+dc*i;
        if (!inBounds(tr,tc)) break;
        const target = brd[tr][tc];
        if (target) {
          if (target[0] !== color) moves.push({ from:[r,c], to:[tr,tc], capture:true });
          break;
        }
        moves.push({ from:[r,c], to:[tr,tc] });
      }
    }
  }

  if (type === 'R' || type === 'Q') {
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
    for (const [dr,dc] of dirs) {
      for (let i=1; i<8; i++) {
        const tr = r+dr*i, tc = c+dc*i;
        if (!inBounds(tr,tc)) break;
        const target = brd[tr][tc];
        if (target) {
          if (target[0] !== color) moves.push({ from:[r,c], to:[tr,tc], capture:true });
          break;
        }
        moves.push({ from:[r,c], to:[tr,tc] });
      }
    }
  }

  if (type === 'K') {
    for (let dr=-1; dr<=1; dr++) {
      for (let dc=-1; dc<=1; dc++) {
        if (dr===0 && dc===0) continue;
        addMove(r+dr, c+dc);
      }
    }
    // Castling
    if (color === 'w' && r === 7 && c === 4) {
      if (castling.wK && !brd[7][5] && !brd[7][6] && brd[7][7] === 'wR' &&
          !isSquareAttacked(7,4,'b',brd) && !isSquareAttacked(7,5,'b',brd) && !isSquareAttacked(7,6,'b',brd)) {
        moves.push({ from:[r,c], to:[7,6], castle:'K' });
      }
      if (castling.wQ && !brd[7][3] && !brd[7][2] && !brd[7][1] && brd[7][0] === 'wR' &&
          !isSquareAttacked(7,4,'b',brd) && !isSquareAttacked(7,3,'b',brd) && !isSquareAttacked(7,2,'b',brd)) {
        moves.push({ from:[r,c], to:[7,2], castle:'Q' });
      }
    }
    if (color === 'b' && r === 0 && c === 4) {
      if (castling.bK && !brd[0][5] && !brd[0][6] && brd[0][7] === 'bR' &&
          !isSquareAttacked(0,4,'w',brd) && !isSquareAttacked(0,5,'w',brd) && !isSquareAttacked(0,6,'w',brd)) {
        moves.push({ from:[r,c], to:[0,6], castle:'K' });
      }
      if (castling.bQ && !brd[0][3] && !brd[0][2] && !brd[0][1] && brd[0][0] === 'bR' &&
          !isSquareAttacked(0,4,'w',brd) && !isSquareAttacked(0,3,'w',brd) && !isSquareAttacked(0,2,'w',brd)) {
        moves.push({ from:[r,c], to:[0,2], castle:'Q' });
      }
    }
  }

  return moves;
}

function isSquareAttacked(r, c, byColor, brd) {
  for (let i=0; i<8; i++) {
    for (let j=0; j<8; j++) {
      const piece = brd[i][j];
      if (!piece || piece[0] !== byColor) continue;
      const type = piece[1];
      
      if (type === 'P') {
        const dir = byColor === 'w' ? -1 : 1;
        if (i+dir === r && (j-1 === c || j+1 === c)) return true;
        continue;
      }
      if (type === 'N') {
        const deltas = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
        for (const [dr,dc] of deltas) {
          if (i+dr === r && j+dc === c) return true;
        }
        continue;
      }
      if (type === 'K') {
        if (Math.abs(i-r) <= 1 && Math.abs(j-c) <= 1 && !(i===r && j===c)) return true;
        continue;
      }
      if (type === 'B' || type === 'Q') {
        const dirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
        for (const [dr,dc] of dirs) {
          for (let k=1; k<8; k++) {
            const tr = i+dr*k, tc = j+dc*k;
            if (!inBounds(tr,tc)) break;
            if (tr === r && tc === c) return true;
            if (brd[tr][tc]) break;
          }
        }
      }
      if (type === 'R' || type === 'Q') {
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        for (const [dr,dc] of dirs) {
          for (let k=1; k<8; k++) {
            const tr = i+dr*k, tc = j+dc*k;
            if (!inBounds(tr,tc)) break;
            if (tr === r && tc === c) return true;
            if (brd[tr][tc]) break;
          }
        }
      }
    }
  }
  return false;
}

function findKing(color, brd) {
  const king = color + 'K';
  for (let i=0; i<8; i++) {
    for (let j=0; j<8; j++) {
      if (brd[i][j] === king) return [i,j];
    }
  }
  return null;
}

function isInCheck(color, brd) {
  const kingPos = findKing(color, brd);
  if (!kingPos) return false;
  const enemy = color === 'w' ? 'b' : 'w';
  return isSquareAttacked(kingPos[0], kingPos[1], enemy, brd);
}

// Simulate move and return new board & new castling/ep
function simulateMove(move, brd, castling, epTarget) {
  const newBoard = brd.map(row => [...row]);
  const newCastling = {...castling};
  let newEp = null;
  const [fr, fc] = move.from;
  const [tr, tc] = move.to;
  const piece = newBoard[fr][fc];

  newBoard[tr][tc] = piece;
  newBoard[fr][fc] = null;

  if (move.enPassant) {
    const dir = piece[0] === 'w' ? 1 : -1;
    newBoard[tr + dir][tc] = null;
  }

  if (move.doublePush) {
    const dir = piece[0] === 'w' ? -1 : 1;
    newEp = [fr + dir, fc];
  }

  if (move.castle === 'K') {
    newBoard[tr][5] = newBoard[tr][7];
    newBoard[tr][7] = null;
  }
  if (move.castle === 'Q') {
    newBoard[tr][3] = newBoard[tr][0];
    newBoard[tr][0] = null;
  }

  if (move.promotion) {
    newBoard[tr][tc] = piece[0] + (move.promoteTo || 'Q');
  }

  // Update castling rights
  if (piece === 'wK') { newCastling.wK = false; newCastling.wQ = false; }
  if (piece === 'bK') { newCastling.bK = false; newCastling.bQ = false; }
  if (piece === 'wR' && fr === 7 && fc === 0) newCastling.wQ = false;
  if (piece === 'wR' && fr === 7 && fc === 7) newCastling.wK = false;
  if (piece === 'bR' && fr === 0 && fc === 0) newCastling.bQ = false;
  if (piece === 'bR' && fr === 0 && fc === 7) newCastling.bK = false;
  if (tr === 7 && tc === 0) newCastling.wQ = false;
  if (tr === 7 && tc === 7) newCastling.wK = false;
  if (tr === 0 && tc === 0) newCastling.bQ = false;
  if (tr === 0 && tc === 7) newCastling.bK = false;

  return { board: newBoard, castling: newCastling, enPassant: newEp };
}

function getLegalMoves(r, c, brd = board, castling = castlingRights, epTarget = enPassantTarget) {
  const piece = brd[r][c];
  if (!piece) return [];
  const color = piece[0];
  const pseudoMoves = getPieceMoves(r, c, brd, epTarget, castling);
  return pseudoMoves.filter(move => {
    const sim = simulateMove(move, brd, castling, epTarget);
    return !isInCheck(color, sim.board);
  });
}

function getAllLegalMoves(color, brd = board, castling = castlingRights, epTarget = enPassantTarget) {
  const moves = [];
  for (let i=0; i<8; i++) {
    for (let j=0; j<8; j++) {
      if (brd[i][j] && brd[i][j][0] === color) {
        moves.push(...getLegalMoves(i, j, brd, castling, epTarget));
      }
    }
  }
  return moves;
}

// ============ AI (simple minimax) ============

const pieceValues = { P: 100, N: 320, B: 330, R: 500, Q: 900, K: 20000 };

function evaluateBoard(brd) {
  let score = 0;
  for (let i=0; i<8; i++) {
    for (let j=0; j<8; j++) {
      const piece = brd[i][j];
      if (!piece) continue;
      const val = pieceValues[piece[1]];
      score += piece[0] === 'b' ? val : -val;
      // Small bonus for center control
      if (piece[1] !== 'K') {
        const centerBonus = (3.5 - Math.abs(i-3.5)) + (3.5 - Math.abs(j-3.5));
        score += piece[0] === 'b' ? centerBonus : -centerBonus;
      }
    }
  }
  return score;
}

function minimax(brd, castling, ep, depth, alpha, beta, isMax, color) {
  if (depth === 0) return evaluateBoard(brd);
  const moves = getAllLegalMoves(color, brd, castling, ep);
  if (moves.length === 0) {
    if (isInCheck(color, brd)) return isMax ? -99999 : 99999;
    return 0;
  }
  // Sort captures first for better pruning
  moves.sort((a,b) => (b.capture?1:0) - (a.capture?1:0));

  const nextColor = color === 'w' ? 'b' : 'w';
  if (isMax) {
    let best = -Infinity;
    for (const move of moves) {
      const sim = simulateMove(move, brd, castling, ep);
      const val = minimax(sim.board, sim.castling, sim.enPassant, depth-1, alpha, beta, false, nextColor);
      best = Math.max(best, val);
      alpha = Math.max(alpha, val);
      if (beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (const move of moves) {
      const sim = simulateMove(move, brd, castling, ep);
      const val = minimax(sim.board, sim.castling, sim.enPassant, depth-1, alpha, beta, true, nextColor);
      best = Math.min(best, val);
      beta = Math.min(beta, val);
      if (beta <= alpha) break;
    }
    return best;
  }
}

function getBestMove(color) {
  const moves = getAllLegalMoves(color);
  if (moves.length === 0) return null;
  let bestMove = null;
  let bestScore = color === 'b' ? -Infinity : Infinity;
  // Shuffle for variety
  moves.sort(() => Math.random() - 0.5);
  const depth = 2;
  for (const move of moves) {
    if (move.promotion) move.promoteTo = 'Q';
    const sim = simulateMove(move, board, castlingRights, enPassantTarget);
    const score = minimax(sim.board, sim.castling, sim.enPassant, depth,
                          -Infinity, Infinity, color === 'w', color === 'w' ? 'b' : 'w');
    if (color === 'b' ? score > bestScore : score < bestScore) {
      bestScore = score;
      bestMove = move;
    }
  }
  return bestMove;
}

// ============ SOUND ============

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function playTone(freq, duration, type='sine', volume=0.2) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

function playMoveSound() {
  playTone(400, 0.08, 'triangle', 0.15);
  setTimeout(() => playTone(600, 0.06, 'triangle', 0.1), 40);
}

function playCaptureSound() {
  playTone(200, 0.1, 'sawtooth', 0.2);
  setTimeout(() => playTone(150, 0.15, 'sawtooth', 0.15), 50);
}

function playCheckSound() {
  playTone(880, 0.1, 'square', 0.15);
  setTimeout(() => playTone(1100, 0.1, 'square', 0.15), 100);
  setTimeout(() => playTone(880, 0.1, 'square', 0.15), 200);
}

function playGameOverSound() {
  const notes = [523, 659, 784, 1046];
  notes.forEach((n, i) => setTimeout(() => playTone(n, 0.3, 'triangle', 0.2), i * 150));
}

function playSelectSound() {
  playTone(800, 0.05, 'sine', 0.1);
}

function playCastleSound() {
  playTone(500, 0.08, 'triangle', 0.15);
  setTimeout(() => playTone(700, 0.08, 'triangle', 0.15), 50);
  setTimeout(() => playTone(900, 0.1, 'triangle', 0.15), 120);
}

// ============ RENDERING ============

function render() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  const inCheck = isInCheck(currentPlayer, board);
  const kingPos = inCheck ? findKing(currentPlayer, board) : null;

  for (let r=0; r<8; r++) {
    for (let c=0; c<8; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell ' + ((r+c) % 2 === 0 ? 'light' : 'dark');
      cell.dataset.row = r;
      cell.dataset.col = c;

      if (selected && selected[0] === r && selected[1] === c) {
        cell.classList.add('selected');
      }

      if (lastMove && ((lastMove.from[0]===r && lastMove.from[1]===c) || (lastMove.to[0]===r && lastMove.to[1]===c))) {
        cell.classList.add('last-move');
      }

      if (kingPos && kingPos[0] === r && kingPos[1] === c) {
        cell.classList.add('check');
      }

      const move = validMoves.find(m => m.to[0] === r && m.to[1] === c);
      if (move) {
        if (move.capture) cell.classList.add('valid-capture');
        else cell.classList.add('valid-move');
      }

      const piece = board[r][c];
      if (piece) {
        const span = document.createElement('span');
        span.textContent = PIECES[piece];
        span.className = piece[0] === 'w' ? 'white-piece' : 'black-piece';
        cell.appendChild(span);
      }

      // Coords
      if (c === 0) {
        const rank = document.createElement('span');
        rank.className = 'coord rank';
        rank.textContent = 8 - r;
        cell.appendChild(rank);
      }
      if (r === 7) {
        const file = document.createElement('span');
        file.className = 'coord file';
        file.textContent = 'abcdefgh'[c];
        cell.appendChild(file);
      }

      cell.addEventListener('click', () => handleClick(r, c));
      boardEl.appendChild(cell);
    }
  }

  document.getElementById('turn').textContent = currentPlayer === 'w' ? 'BLANC' : 'NOIR';
  
  // Captured pieces
  document.getElementById('captured-white').innerHTML = capturedWhite.map(p => 
    `<span class="white-piece">${PIECES[p]}</span>`).join('');
  document.getElementById('captured-black').innerHTML = capturedBlack.map(p => 
    `<span class="black-piece">${PIECES[p]}</span>`).join('');
}

// ============ GAME FLOW ============

function handleClick(r, c) {
  if (gameOver || currentPlayer === 'b' || pendingPromotion) return;

  const piece = board[r][c];

  if (selected) {
    const move = validMoves.find(m => m.to[0] === r && m.to[1] === c);
    if (move) {
      if (move.promotion) {
        pendingPromotion = move;
        showPromotionModal('w');
        return;
      }
      makeMove(move);
      return;
    }
    if (piece && piece[0] === currentPlayer) {
      selected = [r, c];
      validMoves = getLegalMoves(r, c);
      playSelectSound();
      render();
      return;
    }
    selected = null;
    validMoves = [];
    render();
  } else if (piece && piece[0] === currentPlayer) {
    selected = [r, c];
    validMoves = getLegalMoves(r, c);
    playSelectSound();
    render();
  }
}

function showPromotionModal(color) {
  const modal = document.getElementById('promotion-modal');
  const container = document.getElementById('promotion-pieces');
  container.innerHTML = '';
  ['Q', 'R', 'B', 'N'].forEach(type => {
    const div = document.createElement('div');
    div.className = 'promotion-piece ' + (color === 'w' ? 'white-piece' : 'black-piece');
    div.textContent = PIECES[color + type];
    div.onclick = () => {
      pendingPromotion.promoteTo = type;
      modal.classList.remove('active');
      makeMove(pendingPromotion);
      pendingPromotion = null;
    };
    container.appendChild(div);
  });
  modal.classList.add('active');
}

function makeMove(move) {
  const [fr, fc] = move.from;
  const [tr, tc] = move.to;
  const piece = board[fr][fc];
  const captured = board[tr][tc];

  // Save state for undo
  history.push({
    board: board.map(row => [...row]),
    currentPlayer,
    castlingRights: {...castlingRights},
    enPassantTarget: enPassantTarget ? [...enPassantTarget] : null,
    lastMove,
    capturedWhite: [...capturedWhite],
    capturedBlack: [...capturedBlack]
  });

  const sim = simulateMove(move, board, castlingRights, enPassantTarget);
  board = sim.board;
  castlingRights = sim.castling;
  enPassantTarget = sim.enPassant;
  lastMove = { from: [fr, fc], to: [tr, tc] };

  if (captured) {
    if (captured[0] === 'w') capturedWhite.push(captured);
    else capturedBlack.push(captured);
  }
  if (move.enPassant) {
    const dir = piece[0] === 'w' ? 1 : -1;
    // the captured pawn was at tr+dir, tc but is already removed by simulateMove
    const capturedPawn = (piece[0] === 'w' ? 'b' : 'w') + 'P';
    if (capturedPawn[0] === 'w') capturedWhite.push(capturedPawn);
    else capturedBlack.push(capturedPawn);
  }

  // Sound
  if (move.castle) playCastleSound();
  else if (move.capture) playCaptureSound();
  else playMoveSound();

  currentPlayer = currentPlayer === 'w' ? 'b' : 'w';
  selected = null;
  validMoves = [];

  checkGameState();
  render();

  // AI move
  if (!gameOver && currentPlayer === 'b') {
    document.getElementById('message').textContent = 'IA RÉFLÉCHIT...';
    setTimeout(() => {
      const aiMove = getBestMove('b');
      if (aiMove) {
        if (aiMove.promotion) aiMove.promoteTo = 'Q';
        makeMove(aiMove);
      }
    }, 400);
  }
}

function checkGameState() {
  const moves = getAllLegalMoves(currentPlayer);
  const inCheck = isInCheck(currentPlayer, board);
  const msgEl = document.getElementById('message');

  if (moves.length === 0) {
    gameOver = true;
    playGameOverSound();
    if (inCheck) {
      const winner = currentPlayer === 'w' ? 'NOIR' : 'BLANC';
      msgEl.textContent = `ÉCHEC ET MAT - ${winner} GAGNE`;
      setTimeout(() => {
        document.getElementById('end-title').textContent = 'ÉCHEC ET MAT';
        document.getElementById('end-message').textContent = `${winner} remporte la partie !`;
        document.getElementById('end-modal').classList.add('active');
      }, 500);
    } else {
      msgEl.textContent = 'PAT - MATCH NUL';
      setTimeout(() => {
        document.getElementById('end-title').textContent = 'PAT';
        document.getElementById('end-message').textContent = 'Aucun coup légal - Match nul';
        document.getElementById('end-modal').classList.add('active');
      }, 500);
    }
  } else if (inCheck) {
    msgEl.textContent = 'ÉCHEC !';
    playCheckSound();
  } else {
    msgEl.textContent = currentPlayer === 'w' ? 'À VOUS DE JOUER' : 'TOUR DE L\'IA';
  }
}

function newGame() {
  initBoard();
  document.getElementById('message').textContent = 'À VOUS DE JOUER';
  playTone(523, 0.1, 'triangle', 0.15);
  setTimeout(() => playTone(784, 0.15, 'triangle', 0.15), 100);
  render();
}

function undoMove() {
  if (history.length < 2 || gameOver) {
    if (history.length === 1) {
      const state = history.pop();
      board = state.board;
      currentPlayer = state.currentPlayer;
      castlingRights = state.castlingRights;
      enPassantTarget = state.enPassantTarget;
      lastMove = state.lastMove;
      capturedWhite = state.capturedWhite;
      capturedBlack = state.capturedBlack;
      gameOver = false;
      selected = null;
      validMoves = [];
      render();
      document.getElementById('message').textContent = 'À VOUS DE JOUER';
    }
    return;
  }
  // Undo 2 moves (player + AI)
  for (let i = 0; i < 2; i++) {
    if (history.length === 0) break;
    const state = history.pop();
    board = state.board;
    currentPlayer = state.currentPlayer;
    castlingRights = state.castlingRights;
    enPassantTarget = state.enPassantTarget;
    lastMove = state.lastMove;
    capturedWhite = state.capturedWhite;
    capturedBlack = state.capturedBlack;
  }
  gameOver = false;
  selected = null;
  validMoves = [];
  render();
  document.getElementById('message').textContent = 'À VOUS DE JOUER';
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('sound-label').textContent = soundEnabled ? '🔊 Son ON' : '🔇 Son OFF';
  if (soundEnabled) playTone(600, 0.1, 'triangle', 0.15);
}

// Init
initBoard();
render();
</script>
